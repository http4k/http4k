name: Release API
on:
  repository_dispatch:
    types:
    - http4k-release
  workflow_dispatch:
    inputs:
      version:
        description: The version of the API to tag in the docs
        type: string
permissions:
  contents: read
jobs:
  release-api:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Validate release version
      run: |-
        if [[ ! "$VERSION" =~ ^v?[0-9]+(\.[0-9]+){3}(-[A-Za-z]+)?$ ]]; then
          echo "::error::Refusing to proceed: '$VERSION' is not a valid release version"
          exit 1
        fi
      env:
        VERSION: ${{ github.event.client_payload.version || inputs.version }}
      shell: bash
    - name: Setup Java
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        java-version: '25'
        distribution: temurin
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
    - name: Generate API docs
      run: ./gradlew -i dokkaGenerateHtml -PreleaseVersion="$VERSION" -Porg.gradle.parallel=true
      env:
        VERSION: ${{ github.event.client_payload.version || inputs.version }}
      shell: bash
    - name: Checkout API repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: http4k/api
        token: ${{ secrets.AUTHOR_TOKEN }}
        path: tmp
    - name: Copy docs
      run: cp -R build/docs/api/html/* tmp/
      shell: bash
    - name: Commit API docs
      uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8
      with:
        cwd: tmp
        message: release API docs
      env:
        GITHUB_TOKEN: ${{ secrets.AUTHOR_TOKEN }}
    - name: Push API docs
      uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c
      with:
        github_token: ${{ secrets.AUTHOR_TOKEN }}
        directory: tmp
        repository: http4k/api