name: Build
on:
  push:
    branches:
    - master
    - ee
    - lts
    paths-ignore:
    - '**/*.md'
  pull_request:
    branches-ignore:
    - dependency-update
    paths-ignore:
    - '**/*.md'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILDNOTE_API_KEY: ${{ secrets.BUILDNOTE_API_KEY }}
      BUILDNOTE_GITHUB_JOB_NAME: build
    permissions:
      checks: write
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 2
    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
    - name: Dependency review
      if: github.event_name == 'pull_request'
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
      with:
        fail-on-severity: high
    - name: Setup Java
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        java-version: '25'
        distribution: temurin
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
    - name: Build
      timeout-minutes: 120
      run: bin/build_ci.sh
      env:
        HONEYCOMB_API_KEY: ${{ secrets.HONEYCOMB_API_KEY }}
        HONEYCOMB_DATASET: ${{ secrets.HONEYCOMB_DATASET }}
      shell: bash
    - name: Upload coverage to Codecov
      if: github.repository == 'http4k/http4k'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
      with:
        token: ${{ secrets.CODECOV_UPLOAD_TOKEN }}
        slug: http4k/http4k
        files: build/reports/jacoco/test/jacocoRootReport.xml
        disable_search: 'true'
    - name: Buildnote
      if: always()
      uses: buildnote/action@dccb92269d3f9a2515ad63e03d45af686ce3febd
    - name: Publish Test Report
      if: always()
      uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d
      with:
        report_paths: '**/build/test-results/test/TEST-*.xml'
        github_token: ${{ secrets.GITHUB_TOKEN }}
        check_annotations: 'true'
        update_check: 'false'
    - name: Generate release token
      id: release-token
      if: github.event_name == 'push'
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
      with:
        app-id: ${{ secrets.RELEASE_APP_ID }}
        private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    - name: Release (if required)
      if: github.event_name == 'push'
      run: |-
        git config user.name github-actions
        git config user.email github-actions@github.com
        git remote set-url origin https://x-access-token:${{ steps.release-token.outputs.token }}@github.com/${GITHUB_REPOSITORY}.git
        bin/release_tag.sh
      env:
        GH_TOKEN: ${{ steps.release-token.outputs.token }}
      shell: bash