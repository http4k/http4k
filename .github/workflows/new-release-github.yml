name: New Release - GitHub
on:
  repository_dispatch:
    types:
    - http4k-release
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Validate release version
      run: |-
        if [[ ! "$VERSION" =~ ^v?[0-9]+(\.[0-9]+){3}(-[A-Za-z]+)?$ ]]; then
          echo "::error::Refusing to proceed: '$VERSION' is not a valid release version"
          exit 1
        fi
      env:
        VERSION: ${{ github.event.client_payload.version }}
      shell: bash
    - name: Build release note
      run: bin/build_release_note.sh "$VERSION" > NOTE.md
      env:
        VERSION: ${{ github.event.client_payload.version }}
      shell: bash
    - name: Create Release
      uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.event.client_payload.version }}
        release_name: ${{ github.event.client_payload.version }}
        body_path: NOTE.md
        draft: false
        prerelease: false