name: Test Publish Artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  RELEASE_VERSION: 6.59.1.0-ee
jobs:
  build:
    runs-on: linux_16_core_arm
    if: github.repository == 'http4k/http4k'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 6.60.0.0
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        java-version: '21'
        distribution: temurin
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
    - name: Build artifacts, SBOMs, licenses, manifest
      run: |-
        ./gradlew :http4k-incubator:jar :http4k-incubator:sourcesJar :http4k-incubator:dokkaJavadocJar \
        :http4k-incubator:cyclonedxDirectBom :http4k-incubator:generateLicenseReportJson :http4k-incubator:writePublishManifest \
        --no-configuration-cache -PreleaseVersion="$RELEASE_VERSION"
    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
      with:
        aws-access-key-id: ${{ secrets.LTS_PUBLISHING_USER }}
        aws-secret-access-key: ${{ secrets.LTS_PUBLISHING_PASSWORD }}
        aws-region: us-east-1
    - run: bin/preseed-metadata.sh
      env:
        HTTP4K_MAVEN_BUCKET: http4k-maven-staging
    - name: Build S3 Maven layout
      run: |-
        ./gradlew :http4k-incubator:publishAllPublicationsToHttp4kLtsRepository --no-configuration-cache \
        -Psign=true -PreleaseVersion="$RELEASE_VERSION"
      env:
        ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
        ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
    - run: bin/package-build-outputs.sh
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: build-outputs
        path: build-outputs.tar.gz
        retention-days: '1'
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      with:
        cosign-release: v2.4.2
    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
      with:
        aws-access-key-id: ${{ secrets.LTS_PUBLISHING_USER }}
        aws-secret-access-key: ${{ secrets.LTS_PUBLISHING_PASSWORD }}
        aws-region: us-east-1
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: build-outputs
    - run: tar -xzf build-outputs.tar.gz
    - name: Sign artifacts and generate provenance
      run: bin/sign-and-attest.sh "$RELEASE_VERSION"
      env:
        COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    - run: bin/sync-to-s3.sh
      env:
        HTTP4K_MAVEN_BUCKET: s3://http4k-maven-staging
