name: Publish Artifacts
on:
  push:
    tags:
    - '*'
permissions:
  contents: read
jobs:
  build:
    runs-on: linux_16_core_arm
    if: github.repository == 'http4k/http4k'
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.ref_name }}
    - name: Setup Java
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        java-version: '25'
        distribution: temurin
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
    - name: Build artifacts
      run: |-
        ./gradlew jar sourcesJar dokkaJavadocJar testFixturesSourcesJar --no-configuration-cache \
        -PreleaseVersion="$RELEASE_VERSION"
      env:
        RELEASE_VERSION: ${{ github.ref_name }}
      shell: bash
    - name: Generate SBOMs
      run: |-
        ./gradlew cyclonedxDirectBom --no-configuration-cache \
        -PreleaseVersion="$RELEASE_VERSION"
      env:
        RELEASE_VERSION: ${{ github.ref_name }}
      shell: bash
    - name: Generate license reports
      run: |-
        ./gradlew generateLicenseReportJson --no-configuration-cache \
        -PreleaseVersion="$RELEASE_VERSION"
      env:
        RELEASE_VERSION: ${{ github.ref_name }}
      shell: bash
    - name: Build publish manifest
      run: |-
        ./gradlew writePublishManifest --no-configuration-cache \
        -PreleaseVersion="$RELEASE_VERSION"
      env:
        RELEASE_VERSION: ${{ github.ref_name }}
      shell: bash
    - name: Configure AWS credentials (read)
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
      with:
        aws-access-key-id: ${{ secrets.LTS_PUBLISHING_USER }}
        aws-secret-access-key: ${{ secrets.LTS_PUBLISHING_PASSWORD }}
        aws-region: us-east-1
    - name: Pre-seed maven-metadata for merge
      run: bin/preseed-metadata.sh
      shell: bash
    - name: Build S3 Maven layout
      run: |-
        ./gradlew publishAllPublicationsToHttp4kLtsRepository --no-configuration-cache \
        -Psign=true \
        -PreleaseVersion="$RELEASE_VERSION" \
        -PsigningKey="$SIGNING_KEY" \
        -PsigningPassword="$SIGNING_PASSWORD"
      env:
        RELEASE_VERSION: ${{ github.ref_name }}
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
      shell: bash
    - name: Publish to Maven Central
      if: ${{ !(endsWith(github.ref_name, '-ee') || endsWith(github.ref_name, '-lts')) }}
      run: |-
        ./gradlew publishAllPublicationsToMavenCentralRepository --no-configuration-cache \
        -Psign=true \
        -PreleaseVersion="$RELEASE_VERSION" \
        -PsigningKey="$SIGNING_KEY" \
        -PsigningPassword="$SIGNING_PASSWORD"
      env:
        RELEASE_VERSION: ${{ github.ref_name }}
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
      shell: bash
    - name: Package build outputs for signing
      run: bin/package-build-outputs.sh
      shell: bash
    - name: Upload build outputs
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: build-outputs
        path: build-outputs.tar.gz
        retention-days: '1'
  attest:
    runs-on: linux_16_core_arm
    if: github.repository == 'http4k/http4k'
    needs:
    - build
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.ref_name }}
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      with:
        cosign-release: v2.4.2
    - name: Configure AWS credentials (write)
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
      with:
        aws-access-key-id: ${{ secrets.LTS_PUBLISHING_USER }}
        aws-secret-access-key: ${{ secrets.LTS_PUBLISHING_PASSWORD }}
        aws-region: us-east-1
    - name: Download build outputs
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: build-outputs
    - name: Restore build outputs
      run: tar -xzf build-outputs.tar.gz
      shell: bash
    - name: Sign artifacts and generate provenance
      run: bin/sign-and-attest.sh "$RELEASE_VERSION"
      env:
        RELEASE_VERSION: ${{ github.ref_name }}
        COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      shell: bash
    - name: Publish to http4k Maven (S3)
      run: bin/sync-to-s3.sh
      shell: bash
    - name: Publish to http4k Maven (R2)
      run: bin/sync-to-s3.sh
      env:
        HTTP4K_MAVEN_BUCKET: s3://http4k-maven-backup
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_REGION: auto
        AWS_ENDPOINT_URL: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      shell: bash
    - name: Notify Slack
      run: bin/notify_slack.sh ${{ github.ref_name }}
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      shell: bash
    - name: Notify http4k Slack
      run: bin/notify_slack.sh ${{ github.ref_name }}
      env:
        SLACK_WEBHOOK: ${{ secrets.HTTP4K_RELEASE_SLACK_WEBHOOK }}
      shell: bash
  broadcast-private-release:
    runs-on: ubuntu-latest
    if: github.repository == 'http4k/http4k' && (endsWith(github.ref_name, '-ee') || endsWith(github.ref_name, '-lts'))
    needs:
    - attest
    permissions:
      contents: read
    steps:
    - name: Repository Dispatch
      run: |-
        curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/${{ github.repository }}/dispatches \
          -d '{"event_type":"http4k-release","client_payload":{"version":"${{ github.ref_name }}"}}'
      env:
        GH_TOKEN: ${{ secrets.ORG_PUBLIC_REPO_WORKFLOW_TRIGGERING }}
      shell: bash