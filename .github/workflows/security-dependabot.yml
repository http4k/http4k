name: Security - Dependency Analysis (dependabot)
on:
  push:
    branches:
    - master
    paths-ignore:
    - '**/*.md'
  schedule:
  - cron: 0 12 * * 3
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    name: Dependencies
    if: github.repository == 'http4k/http4k'
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Setup Java
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        java-version: '21'
        distribution: temurin
    - name: Generate and save dependency graph
      uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      env:
        DEPENDENCY_GRAPH_INCLUDE_CONFIGURATIONS: ^runtimeClasspath$