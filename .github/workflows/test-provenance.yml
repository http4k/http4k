name: Test Provenance Pipeline
# Hand-written test harness (NOT generated by typeflows). Mirrors the airtight two-job
# publish-artifacts flow (build with no cosign key -> attest with no Gradle), scoped to the
# set of modules the http4k-lts-examples project resolves at a given version: http4k-core +
# http4k-testing-hamkrest + the org.http4k.verify plugin (http4k-tools-verify) and its
# transitive http4k modules. The http4k-bom is deliberately NOT included here.
# NOTE: maven-metadata.xml IS pushed, so the throwaway version lands in the real modules'
# version lists (and Gradle sets <latest>/<release> to it) — use a version that sorts BELOW
# the current release, and clean up the stray version dirs + metadata entries afterwards.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: '6.56.0.9x'
env:
  RELEASE_VERSION: ${{ github.event.inputs.version }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Java
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        java-version: '21'
        distribution: adopt
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
    - name: Generate SBOMs
      run: |-
        ./gradlew :http4k-core:cyclonedxDirectBom :http4k-testing-hamkrest:cyclonedxDirectBom :http4k-tools-verify:cyclonedxDirectBom :http4k-api-jsonschema:cyclonedxDirectBom :http4k-format-core:cyclonedxDirectBom :http4k-format-jackson:cyclonedxDirectBom :http4k-format-kondor-json:cyclonedxDirectBom :http4k-format-moshi:cyclonedxDirectBom :http4k-realtime-core:cyclonedxDirectBom :http4k-security-core:cyclonedxDirectBom \
        --no-configuration-cache -PreleaseVersion="$RELEASE_VERSION"
      shell: bash
    - name: Generate license reports
      run: |-
        ./gradlew :http4k-core:generateLicenseReportJson :http4k-testing-hamkrest:generateLicenseReportJson :http4k-tools-verify:generateLicenseReportJson :http4k-api-jsonschema:generateLicenseReportJson :http4k-format-core:generateLicenseReportJson :http4k-format-jackson:generateLicenseReportJson :http4k-format-kondor-json:generateLicenseReportJson :http4k-format-moshi:generateLicenseReportJson :http4k-realtime-core:generateLicenseReportJson :http4k-security-core:generateLicenseReportJson \
        --no-configuration-cache -PreleaseVersion="$RELEASE_VERSION"
      shell: bash
    - name: Build publish manifest
      run: |-
        ./gradlew :http4k-core:writePublishManifest :http4k-testing-hamkrest:writePublishManifest :http4k-tools-verify:writePublishManifest :http4k-api-jsonschema:writePublishManifest :http4k-format-core:writePublishManifest :http4k-format-jackson:writePublishManifest :http4k-format-kondor-json:writePublishManifest :http4k-format-moshi:writePublishManifest :http4k-realtime-core:writePublishManifest :http4k-security-core:writePublishManifest \
        --no-configuration-cache -PreleaseVersion="$RELEASE_VERSION"
      shell: bash
    - name: Configure AWS credentials (read)
      uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
      with:
        aws-access-key-id: ${{ secrets.LTS_PUBLISHING_USER }}
        aws-secret-access-key: ${{ secrets.LTS_PUBLISHING_PASSWORD }}
        aws-region: us-east-1
    - name: Pre-seed maven-metadata for merge
      run: bin/preseed-metadata.sh
      shell: bash
    - name: Build S3 Maven layout
      run: |-
        ./gradlew :http4k-core:publishAllPublicationsToHttp4kLtsRepository :http4k-testing-hamkrest:publishAllPublicationsToHttp4kLtsRepository :http4k-tools-verify:publishAllPublicationsToHttp4kLtsRepository :http4k-api-jsonschema:publishAllPublicationsToHttp4kLtsRepository :http4k-format-core:publishAllPublicationsToHttp4kLtsRepository :http4k-format-jackson:publishAllPublicationsToHttp4kLtsRepository :http4k-format-kondor-json:publishAllPublicationsToHttp4kLtsRepository :http4k-format-moshi:publishAllPublicationsToHttp4kLtsRepository :http4k-realtime-core:publishAllPublicationsToHttp4kLtsRepository :http4k-security-core:publishAllPublicationsToHttp4kLtsRepository \
        --no-configuration-cache \
        -Psign=true \
        -PreleaseVersion="$RELEASE_VERSION" \
        -PsigningKey="$SIGNING_KEY" \
        -PsigningPassword="$SIGNING_PASSWORD"
      env:
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
      shell: bash
    - name: Show merged maven-metadata (verify merge)
      run: |-
        find build/lts-staging -name maven-metadata.xml | sort | while read -r f; do
          echo "== $f =="
          cat "$f"
        done
      shell: bash
    - name: Package build outputs for signing
      run: bin/package-build-outputs.sh
      shell: bash
    - name: Upload build outputs
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: build-outputs
        path: build-outputs.tar.gz
        retention-days: 1
  attest:
    runs-on: ubuntu-latest
    needs:
    - build
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install cosign
      uses: sigstore/cosign-installer@c56c2d3e59e4281cc41dea2217323ba5694b171e # v3.8.0
    - name: Verify cosign key decryption
      run: echo "test" | cosign sign-blob --key env://COSIGN_PRIVATE_KEY --tlog-upload=false - > /dev/null
      env:
        COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      shell: bash
    - name: Configure AWS credentials (write)
      uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
      with:
        aws-access-key-id: ${{ secrets.LTS_PUBLISHING_USER }}
        aws-secret-access-key: ${{ secrets.LTS_PUBLISHING_PASSWORD }}
        aws-region: us-east-1
    - name: Download build outputs
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: build-outputs
    - name: Restore build outputs
      run: tar -xzf build-outputs.tar.gz
      shell: bash
    - name: Sign artifacts and generate provenance
      run: bin/sign-and-attest.sh "$RELEASE_VERSION"
      env:
        RELEASE_VERSION: ${{ github.event.inputs.version }}
        COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      shell: bash
    - name: Publish to http4k Maven
      run: bin/sync-to-s3.sh
      shell: bash
    - name: List published test artifacts
      run: |-
        while IFS='|' read -r g a v _; do
          p="${g//.//}/$a/$v"
          echo "== $p =="
          aws s3 ls "s3://http4k-maven/$p/" || true
        done < build/publish-manifest.txt
      shell: bash
