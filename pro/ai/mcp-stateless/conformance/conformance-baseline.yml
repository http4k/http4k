# MCP conformance baseline for the stateless 2026-07-28 server.
#
# Run:  ./run-mcp-conformance-tests.sh   (starts the server, runs the alpha suite for 2026-07-28)
# Baseline captured against @modelcontextprotocol/conformance@0.2.0-alpha.10,
#   --spec-version 2026-07-28 --suite all   →   93 checks passed, 9 failed (5 scenarios).
#
# Each entry is a KNOWN, not-yet-implemented scenario. Fixing one = deleting its line here.
# Grouped by root cause (comments only — the parser reads the scenario names).

server:
  # --- A. Core protocol validation gaps (stateless engine, sdk) ---
  # server-stateless is now 30/0 (dropped from baseline): the last check, MissingCapabilityHttp400, is DONE —
  # the event-stream path now buffers the head (PipedSse.onFirstSend gate) so a pre-stream -32021 returns an
  # application/json 400 instead of a 200 SSE event, while live progress/log streaming is preserved.
  # x-mcp-header -> Mcp-Param-* with the =?base64?...?= sentinel: the delivery half is now solved (validation
  # errors go out as application/json 400 via the HTTP face), but still needs the x-mcp-header Tool.Arg feature
  # + pre-dispatch Mcp-Param mirror validation to be exercised.
  - http-custom-header-server-validation

  # --- B. MRTR — sampling/roots deprecated (need sampling+roots inputRequests, not implemented) ---
  - input-required-result-basic-sampling
  - input-required-result-basic-list-roots
  - input-required-result-multiple-input-requests

  # --- C. Content / shape fixes ---
  # tool inputSchema must validate as JSON-Schema-2020-12.
  - json-schema-2020-12

