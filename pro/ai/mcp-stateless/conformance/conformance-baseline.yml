# MCP conformance baseline for the stateless 2026-07-28 server.
#
# Run:  ./run-mcp-conformance-tests.sh   (starts the server, runs the alpha suite for 2026-07-28)
# Baseline captured against @modelcontextprotocol/conformance@0.2.0-alpha.10,
#   --spec-version 2026-07-28 --suite all   →   44 checks passed, 41 failed (16 scenarios).
#
# Each entry is a KNOWN, not-yet-implemented scenario. Fixing one = deleting its line here.
# Grouped by root cause (comments only — the parser reads the scenario names).

server:
  # --- A. Core protocol validation gaps (stateless engine, sdk) ---
  # Missing/invalid _meta.protocolVersion must -> 400 + -32602; unsupported version -> 400 +
  # UnsupportedProtocolVersionError (we return 200); header<->body mismatch -> 400 + -32020;
  # removed/unknown RPC methods (initialize/ping/logging/setLevel/resources/subscribe|unsubscribe
  # + any unknown) -> 404 + -32601 (we return 202 Accepted). Also needs the two diagnostic tools
  # below to be testable at all.
  - server-stateless
  # header<->body mirror validation (Mcp-Method / Mcp-Name) -> 400 + -32020 on mismatch.
  - http-header-validation
  # x-mcp-header -> Mcp-Param-* with the =?base64?...?= sentinel (deferred in Stage 5).
  - http-custom-header-server-validation

  # --- B. MRTR — sampling/roots deprecated (need sampling+roots inputRequests, not implemented) ---
  - input-required-result-basic-sampling
  - input-required-result-basic-list-roots
  - input-required-result-multiple-input-requests
  # capability-check wants the server to FILTER undeclared-capability inputRequests and still return an
  # input_required (not -32021). That conflicts with test_missing_capability's -32021 requirement (in the
  # still-baselined server-stateless); resolve the filter-vs-reject spec nuance together with that.
  - input-required-result-capability-check
  # validate-input (SHOULD): sends malformed inputResponses (12345/null); our typed parse rejects it as a
  # hard 400 rather than a graceful JSON-RPC re-request. Needs lenient inputResponses deserialization.
  - input-required-result-validate-input

  # --- C. Content / shape fixes ---
  # tool inputSchema must validate as JSON-Schema-2020-12.
  - json-schema-2020-12

  # --- D. Deferred (hard / YAGNI) ---
  # requestState integrity (HMAC) so a tampered state is rejected — deferred in Stage 4.
  - input-required-result-tampered-state
